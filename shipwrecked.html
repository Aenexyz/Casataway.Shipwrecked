<style>

.inv{margin:14px 0 6px;color:var(--text)}

.rt{display:flex;align-items:center;gap:12px}.top{flex-wrap:wrap}.invbtn{font:inherit;font-size:15px;background:var(--panel);color:var(--sand);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}.menu{display:flex;flex-direction:column;gap:8px}.cat{font:inherit;font-size:18px;text-align:left;width:100%;padding:13px 16px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline}.cat:hover,.cat.on{border-color:var(--sand)}.cat .n{color:var(--muted);font-size:14px}.subs{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px 14px;padding-left:12px;border-left:2px solid var(--line)}.subs button{font:inherit;font-size:17px;text-align:left;width:100%;padding:11px 14px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;cursor:pointer}.subs button:hover{border-color:var(--sand)}.subs .eatbox button{width:auto;white-space:nowrap}

.tbl{width:100%;border-collapse:collapse}.tbl th{width:78px;text-align:left;vertical-align:top;font-weight:400;font-size:14px;color:var(--muted);padding:14px 8px 0 0}.tbl td{padding:8px 0;border-top:1px solid var(--line)}.tbl tr:last-child td,.tbl tr:last-child th{border-bottom:1px solid var(--line)}.chips{display:flex;flex-wrap:wrap;gap:6px}.tbl button{font:inherit;font-size:15px;line-height:1.3;text-align:left;padding:8px 12px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;cursor:pointer}.tbl button:hover{border-color:var(--sand)}.tbl .cost{display:block;float:none;margin:2px 0 0;font-size:12px;text-align:left}@media(max-width:480px){.tbl th,.tbl td{display:block;width:auto}.tbl th{padding:10px 0 0;border-top:1px solid var(--line)}.tbl td{border-top:0;padding-top:4px}}

#intro{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 7vh) 16px calc(env(safe-area-inset-bottom,0px) + 6vh);background:linear-gradient(#0a0f14 0%,#16222b 55%,#1d2f3a 100%);cursor:pointer;overflow:hidden;transition:opacity .7s ease;-webkit-tap-highlight-color:transparent;user-select:none}

function mkSched(from){
  const SC=[5,10,15,20,23],days=[];
  for(let d=Math.max(6,from);d<=24;d++)if(!SC.includes(d))days.push(d);
  const n=Math.min(4,days.length),ch=[];
  for(let a=0;a<400&&ch.length<n;a++){const d=days[Math.floor(Math.random()*days.length)];if(ch.includes(d))continue;if(a<300&&ch.some(x=>Math.abs(x-d)<2))continue;ch.push(d)}
  ch.sort((a,b)=>a-b);
  const ids=["jackals","flood","spider","brushfire"].sort(()=>Math.random()-.5);
  return ch.map((d,i)=>({id:ids[i],day:d,h:9+Math.floor(Math.random()*9)}));
}
